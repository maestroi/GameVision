# GameVision private homelab stack.
#
# This deliberately mirrors the PokePilot deployment shape: the task publishes
# one host-mode port and the existing homelab router owns DNS/TLS/routing for
# gamevision.labstack.cc. There are no Traefik labels or public routes here.
#
# Deploy from a Swarm manager:
#   docker stack deploy --with-registry-auth -c deploy/swarm.yml gamevision
#
# Required on the node that receives the task:
#   /opt/gamevision/roms/pokemon_red.gb
#   /opt/gamevision/                 (persistent sessions/state)

services:
  app:
    image: ${GAMEVISION_IMAGE:-ghcr.io/maestroi/gamevision:latest}
    environment:
      GAMEVISION_BASE_URL: ${GAMEVISION_BASE_URL:-http://192.168.50.81:8002/v1}
      GAMEVISION_MODEL: ${GAMEVISION_MODEL:-Qwen3-VL-4B-Instruct}
      GAMEVISION_API_KEY: ${GAMEVISION_API_KEY:-}
      # Startup is gated by a real image request, not just the model name.
      # If :8002 is the text-only/no-mmproj server the task waits here and the
      # web app does not bind its port. If vision later disappears, PID 1 stops
      # GameVision so Swarm restarts into the same preflight gate.
      GAMEVISION_REQUIRE_VISION: ${GAMEVISION_REQUIRE_VISION:-1}
      GAMEVISION_WATCH_VISION: ${GAMEVISION_WATCH_VISION:-1}
      GAMEVISION_VISION_PROBE_TIMEOUT: ${GAMEVISION_VISION_PROBE_TIMEOUT:-30}
      GAMEVISION_VISION_WAIT_INTERVAL: ${GAMEVISION_VISION_WAIT_INTERVAL:-10}
      GAMEVISION_VISION_WATCH_INTERVAL: ${GAMEVISION_VISION_WATCH_INTERVAL:-30}
    command:
      - --game
      - pokemon-red
      - --rom
      - /rom/pokemon_red.gb
      - --base-url
      - ${GAMEVISION_BASE_URL:-http://192.168.50.81:8002/v1}
      - --model
      - ${GAMEVISION_MODEL:-Qwen3-VL-4B-Instruct}
      - --api-key
      - ${GAMEVISION_API_KEY:-}
      - --goal
      - ${GAMEVISION_GOAL:-Start Pokémon Red and progress as far as possible.}
      - --vision-scale
      - ${GAMEVISION_VISION_SCALE:-2}
      - --button-hold-frames
      - ${GAMEVISION_HOLD_FRAMES:-16}
      - --settle-frames
      - ${GAMEVISION_SETTLE_FRAMES:-12}
      - --history
      - ${GAMEVISION_HISTORY:-8}
      - --temperature
      - ${GAMEVISION_TEMPERATURE:-0}
      - --max-tokens
      - ${GAMEVISION_MAX_TOKENS:-96}
      - --timeout
      - ${GAMEVISION_TIMEOUT:-60s}
      - --session-dir
      - /data/sessions
      - --http
      - 0.0.0.0:8099
      - --cgb=true
      - --save-decision-frames=true
    volumes:
      - ${GAMEVISION_ROM:-/opt/gamevision/roms/pokemon_red.gb}:/rom/pokemon_red.gb:ro
      - ${GAMEVISION_STATE_DIR:-/opt/gamevision}:/data
    ports:
      - target: 8099
        published: ${GAMEVISION_PORT:-18082}
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        window: 30s
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 512M
