name: Auto-merge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge trusted PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Merge owner-authored PR after successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER:-}" || -z "${HEAD_SHA:-}" ]]; then
            echo "The successful CI run is not associated with a pull request; nothing to merge."
            exit 0
          fi

          metadata="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author,isDraft,headRefOid,title,baseRefName,state)"
          author="$(jq -r '.author.login' <<<"$metadata")"
          is_draft="$(jq -r '.isDraft' <<<"$metadata")"
          current_head="$(jq -r '.headRefOid' <<<"$metadata")"
          title="$(jq -r '.title' <<<"$metadata")"
          base="$(jq -r '.baseRefName' <<<"$metadata")"
          state="$(jq -r '.state' <<<"$metadata")"

          if [[ "$state" != "OPEN" ]]; then
            echo "Skipping PR #${PR_NUMBER}: PR is no longer open."
            exit 0
          fi

          if [[ "$author" != "$OWNER" ]]; then
            echo "Skipping PR #${PR_NUMBER}: author ${author} is not repository owner ${OWNER}."
            exit 0
          fi

          if [[ "$is_draft" == "true" ]]; then
            echo "Skipping PR #${PR_NUMBER}: PR is still a draft."
            exit 0
          fi

          if [[ "$base" != "main" ]]; then
            echo "Skipping PR #${PR_NUMBER}: base branch is ${base}, not main."
            exit 0
          fi

          if [[ "$current_head" != "$HEAD_SHA" ]]; then
            echo "Skipping PR #${PR_NUMBER}: head moved after the successful CI run."
            exit 0
          fi

          if [[ "$title" == *"[no-automerge]"* ]]; then
            echo "Skipping PR #${PR_NUMBER}: title contains [no-automerge]."
            exit 0
          fi

          merged="$(
            gh api \
              --method PUT \
              "repos/${REPO}/pulls/${PR_NUMBER}/merge" \
              -f sha="$HEAD_SHA" \
              -f merge_method=squash \
              --jq '.merged'
          )"

          if [[ "$merged" != "true" ]]; then
            echo "GitHub did not merge PR #${PR_NUMBER}."
            exit 1
          fi

          echo "Merged PR #${PR_NUMBER} after successful CI."
